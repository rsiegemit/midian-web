# configs/grid.yaml -- named grids for `python -m rte.run --grid <name>` (SPEC §3, §7, §6A).
# Axes: backend n K dist beta liar_select collude declared_source lie_mode demand b Q (lists = cartesian product).
# methods: `all` = every algorithmic method file (LLM-only ones only on the llm backend) + `extra` variants, minus `exclude`;
# or an explicit list of `name` | {name, params}. `mirror_of: <grid>` copies that grid, then overrides.
# `blocks:` = several axis blocks in one grid. The runner always adds an `oracle` row per (cell, seed).
defaults:
  backend: bernoulli
  K: [16]
  liar_select: [random]
  collude: [true]
  declared_source: [programmatic]
  lie_mode: [inflate]
  demand: [uniform]
  b: [3]
  Q: 1000
  seeds: 1-5
  methods: all
  extra:                                        # paired variants that make target 2 a like-for-like test (online vs frozen)
    - {name: flat_probe_argmax, params: {online: true}}
    - {name: midian, params: {online: false}}
  exclude: []

_sets:
  live: &live {backend: llm, n: [1000], dist: [specialist, heavy_tail, bimodal], beta: [0, 0.1, 0.25, 0.5],
               liar_select: [random, low_skill_first], declared_source: [programmatic, self_described]}
  core4: &core4 [midian, random, declared_argmax, flat_probe_argmax]
  # SPEC §6A: the frameworks are the paper's HEADLINE comparison, so they ride the core grid too
  budget: &budget [midian, flat_probe_argmax, ucb_per_family, thompson_per_family, sequential_halving, verify_on_claim,
                   warm_start_bandit, referral_network, gossip_reputation_greedy, declared_argmax, random]
  midian_variants: &midian_variants
    - flat_probe_argmax
    - {name: midian, params: {r: 5,  delta: 0.0}}
    - {name: midian, params: {r: 5,  delta: 0.3333333333333333}}
    - {name: midian, params: {r: 10, delta: 0.0}}
    - {name: midian, params: {r: 10, delta: 0.3333333333333333}}
    - {name: midian, params: {r: 20, delta: 0.0}}
    - {name: midian, params: {r: 20, delta: 0.3333333333333333}}
  frameworks: &frameworks [fw_langgraph, fw_crewai, fw_autogen, fw_magentic_one, fw_maf, fw_openai_agents, fw_google_adk,
                           fw_llamaindex, fw_smolagents, fw_camel_workforce]
  fw_paired: &fw_paired [midian, random, declared_argmax, flat_probe_argmax, llm_supervisor]
  cost_curve: &cost_curve [midian, flat_probe_argmax, declared_argmax, ucb_per_family, flat_nsw_router, cnp_self_bid, random]

grids:
  smoke:            {n: [100], dist: [specialist], beta: [0, 0.25], Q: 200, seeds: 1-2}

  # ---- live LLM grids (SPEC §3 compute plan)
  live_core_n100:   {<<: *live, n: [100], methods: *core4}
  live_f1_n1000:    *live                                        # every algorithmic method incl. the two LLM-native ones
  # Headline comparison (SPEC §6A): the 10 frameworks vs MIDIAN, paired with core4 + llm_supervisor. Each framework fetch is
  # a real supervisor call (~1-2 s, serial per framework), so: ecological channel only, 3 seeds, Q=300, one process per method.
  fw_live_n1000:    {backend: llm, n: [1000], dist: [specialist, heavy_tail, bimodal], beta: [0, 0.1, 0.25, 0.5],
                     declared_source: [self_described], seeds: 1-3, Q: 300, methods: [*frameworks, *fw_paired]}
  fw_live_n100:     {mirror_of: fw_live_n1000, n: [100]}
  live_extra_n1000: {<<: *live, dist: [correlated, iid_uniform]}
  live_n10k:        {backend: llm, n: [10000], dist: [specialist], beta: [0, 0.25], b: [1], exclude: [trueskill_per_family]}
  budget_sweep:     {backend: llm, n: [1000], dist: [specialist, heavy_tail, bimodal], beta: [0.25], b: [1, 3, 10], methods: *budget}
  midian_internals: {backend: llm, n: [1000], dist: [specialist], beta: [0.1, 0.25, 0.5], collude: [true, false], methods: *midian_variants}
  fw_k_sensitivity: {backend: llm, n: [1000], dist: [specialist], beta: [0, 0.25], declared_source: [self_described], seeds: 1-3, Q: 300,
                     methods: [{name: fw_langgraph, params: {k: 5}}, {name: fw_langgraph, params: {k: 10}}, {name: fw_langgraph, params: {k: 20}},
                               {name: fw_autogen,   params: {k: 5}}, {name: fw_autogen,   params: {k: 10}}, {name: fw_autogen,   params: {k: 20}}]}
  fw_appendix:      {backend: llm, n: [100], dist: [specialist], beta: [0, 0.25], declared_source: [self_described], seeds: 1-3, Q: 300,
                     methods: [fw_metagpt, fw_agentscope, midian, random]}

  # ---- bernoulli twins of every live grid: exercise the pipeline before the fleet is up (never headline numbers)
  bernoulli_mirror_live_core_n100:   {mirror_of: live_core_n100,   backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_live_f1_n1000:    {mirror_of: live_f1_n1000,    backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_live_extra_n1000: {mirror_of: live_extra_n1000, backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_live_n10k:        {mirror_of: live_n10k,        backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_budget_sweep:     {mirror_of: budget_sweep,     backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_midian_internals: {mirror_of: midian_internals, backend: bernoulli, seeds: 1-10, Q: 2000}

  # ---- scale (F2/F3): replay 1e4-1e6 (real outcomes), bernoulli 1e2-1e7 calibrated to the measured S
  replay_scale:
    backend: replay
    K: [64]
    dist: [specialist, heavy_tail, bimodal]
    beta: [0.25]
    seeds: 1-3
    exclude: [trueskill_per_family]
    blocks: [{n: [10000, 100000]}, {n: [1000000], b: [1]}]
  # cheap multi-n twin of bernoulli_scale: exercises F2/F3/F3b and the cost-exponent fits on CPU
  # in minutes, so the message-accounting figures are verified before the fleet is up.
  bernoulli_cost_smoke:
    {n: [100, 1000, 10000], dist: [specialist], beta: [0.25], Q: 500, seeds: 1-3, methods: *cost_curve}

  bernoulli_scale:
    K: [64]
    dist: [specialist]
    beta: [0.25]
    seeds: 1-3
    methods: *cost_curve
    backend_kwargs: {calibrate_from: $RTE_DATA/populations/specialist_n1000_K16_seed1/S.npy}
    blocks: [{n: [100, 1000, 10000, 100000]}, {n: [1000000], b: [1]}, {n: [10000000], b: [1], seeds: 1}]
