    methods: [&fw10_em [{name: fw_langgraph, params: {retrieval: embed, dedup: true}}, {name: fw_crewai, params: {retrieval: embed, dedup: true}},
                        {name: fw_autogen, params: {retrieval: embed, dedup: true}}, {name: fw_magentic_one, params: {retrieval: embed, dedup: true}},
