  fw_live_n10k_verified_va:
    mirror_of: live_n10k_v2
    methods: [&fw10_va [{name: fw_langgraph, params: {retrieval: midian, r: 10}}, {name: fw_crewai, params: {retrieval: midian, r: 10}},
                        {name: fw_autogen, params: {retrieval: midian, r: 10}}, {name: fw_magentic_one, params: {retrieval: midian, r: 10}},
                        {name: fw_maf, params: {retrieval: midian, r: 10}}, {name: fw_openai_agents, params: {retrieval: midian, r: 10}},
                        {name: fw_google_adk, params: {retrieval: midian, r: 10}}, {name: fw_llamaindex, params: {retrieval: midian, r: 10}},
                        {name: fw_smolagents, params: {retrieval: midian, r: 10}}, {name: fw_camel_workforce, params: {retrieval: midian, r: 10}}]]
