              {name: fw_crewai, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}},
              {name: fw_autogen, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}},
              {name: fw_magentic_one, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}},
              {name: fw_maf, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}},
