  fw_live_n10k_cartel_backfill:   {mirror_of: fw_live_n10k_cartel,   methods: *fw10_backfill}

  # ---- 2026-09-22: the one missing bar -- random at n = 10^4 under the beta = 0.5 low-skill cartel (live_n10k_v2 ran
