  # ---- 2026-09-17: the SOTA retrieval stack in front of the frameworks (METHODS.md 5a). The pre-registered adapter is
  # hashed TF-IDF and the _em mirrors are all-MiniLM-L6-v2; neither is what a deployed system puts in front of a
  # framework, so the frameworks have only ever been measured with weak retrieval. These arms are the production
  # stack: BM25 alone, Qwen3-Embedding-8B alone (top of MTEB), reciprocal-rank fusion of the two, and fusion + a
  # Qwen3-Reranker-4B cross-encoder over the top 50. A shortlist depends only on the population, so the dense block
  # and the reranked table are precomputed by `scripts/embed_populations.py --sota` and every job here is CPU-only.
