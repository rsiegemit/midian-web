              {name: fw_google_adk, params: {retrieval: embed, dedup: true, embed_model: Qwen/Qwen3-Embedding-8B, embed_instruct: "Given a task family, retrieve agents whose demonstrated skill at that family is highest"}},
              {name: fw_llamaindex, params: {retrieval: embed, dedup: true, embed_model: Qwen/Qwen3-Embedding-8B, embed_instruct: "Given a task family, retrieve agents whose demonstrated skill at that family is highest"}},
              {name: fw_smolagents, params: {retrieval: embed, dedup: true, embed_model: Qwen/Qwen3-Embedding-8B, embed_instruct: "Given a task family, retrieve agents whose demonstrated skill at that family is highest"}},
              {name: fw_camel_workforce, params: {retrieval: embed, dedup: true, embed_model: Qwen/Qwen3-Embedding-8B, embed_instruct: "Given a task family, retrieve agents whose demonstrated skill at that family is highest"}}]]

  # ---- 2026-09-18: the declared-claim shortlist, the cheap baseline every text retriever should be measured against.
  # Diagnostics (jobs/shortlist_skill.py, jobs/declared_cohort.py) at 10^5 show the declared top-10 has the HIGHEST
  # shortlist mean of any source (0.615 honest, 0.526-0.572 under liars) while its best member is only 0.66-0.75
  # against the MIDIAN cohort's 0.838 -- and frameworks recover just 15-35 % of the mean->best gap, so the mean is what
  # they mostly get. That predicts the declared top-10 BEATS the MIDIAN cohort as a framework shortlist in three of five
  # regimes, losing only under the beta = 0.25 cartel. Prediction from a linear fit, hence this grid.
  # It also concentrates liars: 74 % of the declared top-10 at beta = 0.5 random, against a 50 % population rate.
  fw_live_n100k_declared:
    mirror_of: live_n100k
    methods: [&fw10_declared [{name: fw_langgraph, params: {retrieval: declared, dedup: true}},
              {name: fw_crewai, params: {retrieval: declared, dedup: true}},
              {name: fw_autogen, params: {retrieval: declared, dedup: true}},
              {name: fw_magentic_one, params: {retrieval: declared, dedup: true}},
              {name: fw_maf, params: {retrieval: declared, dedup: true}},
              {name: fw_openai_agents, params: {retrieval: declared, dedup: true}},
              {name: fw_google_adk, params: {retrieval: declared, dedup: true}},
              {name: fw_llamaindex, params: {retrieval: declared, dedup: true}},
              {name: fw_smolagents, params: {retrieval: declared, dedup: true}},
              {name: fw_camel_workforce, params: {retrieval: declared, dedup: true}}]]

  # ---- 2026-09-18: POSITION CONTROL for the MIDIAN cohort. The midian modes hand the framework [MIDIAN's pick] + its
  # leaf cohort, so the best agent sits in position 1. Frameworks recover 35 % of the mean->best gap on that cohort
  # against 15-28 % on every text shortlist (jobs/shortlist_skill.py, jobs/cohort_skill.py), and position bias is the
  # obvious confound: the MIDIAN cohort's mean true skill is only 0.447 against a population mean of 0.426, so its
  # advantage is NOT that the members are better -- it is that one excellent member (0.832) is present, and first.
  # shuffle=true permutes the same members deterministically. If success falls to the text-shortlist recovery rate,
  # the frameworks were reading position, not descriptions, and the whole framework comparison measures ordering.
  fw_live_n100k_verified_va_shuffled:
    mirror_of: live_n100k
    methods: [[{name: fw_langgraph, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_crewai, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_autogen, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_magentic_one, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_maf, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_openai_agents, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_google_adk, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_llamaindex, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_smolagents, params: {retrieval: midian, r: 10, shuffle: true}},
              {name: fw_camel_workforce, params: {retrieval: midian, r: 10, shuffle: true}}]]

  # ---- 2026-09-21: the LYING-TEXT condition (erratum 27). The benchmark's lie inflates the declared MATRIX but
  # leaves the self-description TEXT stating the agent's true specialty, so every text retriever reads a channel the
  # adversary never attacks -- which is why dense+I-competent scores 0.523 in BOTH the honest and cartel cells.
  # lie_text rederives the "Declared areas:" clause from the declared channel for EVERY agent (the method never
  # learns who lies). The LLM prose is untouched, so this is a PARTIAL text lie and a LOWER BOUND on the damage.
  # Paired within one grid: TF-IDF and BM25, honest text vs lied text, so the contrast needs no cross-grid join.
  # Both retrievers compute from text inside the job -- no embedding cache, so the condition costs nothing extra.
  fw_live_n100k_lietext:
    mirror_of: live_n100k
    methods: [[{name: fw_langgraph, params: {retrieval: tfidf, dedup: true}},
              {name: fw_crewai, params: {retrieval: tfidf, dedup: true}},
              {name: fw_autogen, params: {retrieval: tfidf, dedup: true}},
              {name: fw_magentic_one, params: {retrieval: tfidf, dedup: true}},
              {name: fw_maf, params: {retrieval: tfidf, dedup: true}},
              {name: fw_openai_agents, params: {retrieval: tfidf, dedup: true}},
              {name: fw_google_adk, params: {retrieval: tfidf, dedup: true}},
              {name: fw_llamaindex, params: {retrieval: tfidf, dedup: true}},
              {name: fw_smolagents, params: {retrieval: tfidf, dedup: true}},
              {name: fw_camel_workforce, params: {retrieval: tfidf, dedup: true}}],
