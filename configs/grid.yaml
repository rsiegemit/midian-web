# configs/grid.yaml -- named grids for `python -m rte.run --grid <name>` (SPEC §3, §7, §6A).
# Axes: backend n K dist beta liar_select collude declared_source lie_mode demand b Q (lists = cartesian product).
# methods: `all` = every algorithmic method file (LLM-only ones only on the llm backend) + `extra` variants, minus `exclude`;
# or an explicit list of `name` | {name, params}. `mirror_of: <grid>` copies that grid, then overrides.
# `blocks:` = several axis blocks in one grid. The runner always adds an `oracle` row per (cell, seed).
defaults:
  backend: bernoulli
  K: [16]
  liar_select: [random]
  collude: [true]
  declared_source: [programmatic]
  lie_mode: [inflate]
  demand: [uniform]
  b: [3]
  Q: 1000
  seeds: 1-5
  methods: all
  extra:                                        # paired variants that make target 2 a like-for-like test (online vs frozen)
    - {name: flat_probe_argmax, params: {online: true}}
    - {name: midian, params: {online: false}}
    - {name: midian, params: {verify: true, cached: true}}   # MIDIAN-V: verify at promotion, root caches its pick (post-hoc, see DEVIATIONS)
    - {name: midian, params: {r: 5}}                          # cohorts of 5: our scale is small (n=100..10^4)
    - {name: midian, params: {verify: true, cached: true, r: 5}}
    - {name: sequential_halving, params: {peer_reported: true}}   # the fair control: halving through MIDIAN's report channel
  exclude: []

_sets:
  live: &live {backend: llm, n: [1000], dist: [specialist, heavy_tail, bimodal], beta: [0, 0.1, 0.25, 0.5],
               liar_select: [random, low_skill_first], declared_source: [programmatic, self_described]}
  core4: &core4 [midian, {name: midian, params: {r: 5}}, {name: midian, params: {verify: true, cached: true}}, {name: midian, params: {verify: true, cached: true, r: 5}}, random, declared_argmax, flat_probe_argmax]
  # SPEC §6A: the frameworks are the paper's HEADLINE comparison, so they ride the core grid too
  budget: &budget [midian, {name: midian, params: {r: 5}}, {name: midian, params: {verify: true, cached: true}}, {name: midian, params: {verify: true, cached: true, r: 5}}, flat_probe_argmax, ucb_per_family, thompson_per_family, sequential_halving, verify_on_claim,
                   warm_start_bandit, referral_network, gossip_reputation_greedy, declared_argmax, random]
  midian_variants: &midian_variants
    - flat_probe_argmax
    - {name: midian, params: {r: 5,  delta: 0.0}}
    - {name: midian, params: {r: 5,  delta: 0.3333333333333333}}
    - {name: midian, params: {r: 10, delta: 0.0}}
    - {name: midian, params: {r: 10, delta: 0.3333333333333333}}
    - {name: midian, params: {r: 20, delta: 0.0}}
    - {name: midian, params: {r: 20, delta: 0.3333333333333333}}
    - {name: midian, params: {verify: true, cached: true, r: 5}}      # MIDIAN-V at r=5: half the reports, equal quality on bernoulli
    - {name: midian, params: {verify: true, cached: true, r: 20}}
    - {name: midian, params: {verify: true, cached: true, r: 10}}      # added 2026-09-02 16:10 to complete the V r-sweep
  frameworks: &frameworks [fw_langgraph, fw_crewai, fw_autogen, fw_magentic_one, fw_maf, fw_openai_agents, fw_google_adk,
                           fw_llamaindex, fw_smolagents, fw_camel_workforce]
  frameworks_verified: &frameworks_verified   # same frameworks, shortlist = MIDIAN-V's leaf cohort instead of TF-IDF over self-descriptions
    - {name: fw_langgraph, params: {retrieval: midian, r: 10}}
    - {name: fw_langgraph, params: {retrieval: midian, r: 5}}
    - {name: fw_crewai, params: {retrieval: midian, r: 10}}
    - {name: fw_crewai, params: {retrieval: midian, r: 5}}
    - {name: fw_autogen, params: {retrieval: midian, r: 10}}
    - {name: fw_autogen, params: {retrieval: midian, r: 5}}
    - {name: fw_magentic_one, params: {retrieval: midian, r: 10}}
    - {name: fw_magentic_one, params: {retrieval: midian, r: 5}}
    - {name: fw_maf, params: {retrieval: midian, r: 10}}
    - {name: fw_maf, params: {retrieval: midian, r: 5}}
    - {name: fw_openai_agents, params: {retrieval: midian, r: 10}}
    - {name: fw_openai_agents, params: {retrieval: midian, r: 5}}
    - {name: fw_google_adk, params: {retrieval: midian, r: 10}}
    - {name: fw_google_adk, params: {retrieval: midian, r: 5}}
    - {name: fw_llamaindex, params: {retrieval: midian, r: 10}}
    - {name: fw_llamaindex, params: {retrieval: midian, r: 5}}
    - {name: fw_smolagents, params: {retrieval: midian, r: 10}}
    - {name: fw_smolagents, params: {retrieval: midian, r: 5}}
    - {name: fw_camel_workforce, params: {retrieval: midian, r: 10}}
    - {name: fw_camel_workforce, params: {retrieval: midian, r: 5}}
  fw_paired: &fw_paired [midian, {name: midian, params: {r: 5}}, {name: midian, params: {verify: true, cached: true}}, {name: midian, params: {verify: true, cached: true, r: 5}}, random, declared_argmax, flat_probe_argmax, llm_supervisor]
  cost_curve: &cost_curve [midian, {name: midian, params: {r: 5}}, {name: midian, params: {verify: true, cached: true}}, {name: midian, params: {verify: true, cached: true, r: 5}}, flat_probe_argmax, declared_argmax, ucb_per_family, flat_nsw_router, cnp_self_bid, random]

grids:
  smoke:            {n: [100], dist: [specialist], beta: [0, 0.25], Q: 200, seeds: 1-2}

  # ---- live LLM grids (SPEC §3 compute plan)
  live_core_n100:   {<<: *live, n: [100], methods: *core4}
  live_f1_n1000:    *live                                        # every algorithmic method incl. the two LLM-native ones
  # Headline comparison (SPEC §6A): the 10 frameworks vs MIDIAN, paired with core4 + llm_supervisor. Each framework fetch is
  # a real supervisor call (~1-2 s, serial per framework), so: ecological channel only, 3 seeds, Q=300, one process per method.
  fw_live_n1000:    {backend: llm, n: [1000], dist: [specialist, heavy_tail, bimodal], beta: [0, 0.1, 0.25, 0.5],
                     declared_source: [self_described], seeds: 1-10, Q: 1000,
                     methods: [*frameworks, {name: fw_magentic_one, params: {supervisor: Qwen/Qwen2.5-14B-Instruct}}, *fw_paired]}   # v2 0.4: 5 seeds, Q=1000 (was 3/300); 14B orchestrator arm is asymmetric (0.2)
  fw_live_n100:     {mirror_of: fw_live_n1000, n: [100]}
  fw_live_n1000_verified: {mirror_of: fw_live_n1000, methods: *frameworks_verified}   # labeled variant: verified shortlist
  fw_live_n100_verified:  {mirror_of: fw_live_n1000, n: [100], methods: *frameworks_verified}
  live_extra_n1000: {<<: *live, dist: [correlated, iid_uniform]}
  live_n10k:        {backend: llm, n: [10000], dist: [specialist], beta: [0, 0.25], b: [1], exclude: [trueskill_per_family]}
  budget_sweep:     {backend: llm, n: [1000], dist: [specialist, heavy_tail, bimodal], beta: [0.25], b: [1, 3, 10], methods: *budget}
  midian_internals: {backend: llm, n: [1000], dist: [specialist], beta: [0.1, 0.25, 0.5], collude: [true, false], methods: *midian_variants}
  fw_k_sensitivity: {backend: llm, n: [1000], dist: [specialist], beta: [0, 0.25], declared_source: [self_described], seeds: 1-3, Q: 300,
                     methods: [{name: fw_langgraph, params: {k: 5}}, {name: fw_langgraph, params: {k: 10}}, {name: fw_langgraph, params: {k: 20}},
                               {name: fw_autogen,   params: {k: 5}}, {name: fw_autogen,   params: {k: 10}}, {name: fw_autogen,   params: {k: 20}}]}
  fw_appendix:      {backend: llm, n: [100], dist: [specialist], beta: [0, 0.25], declared_source: [self_described], seeds: 1-3, Q: 300,
                     methods: [fw_agentscope, midian, random]}          # fw_metagpt: NotImplemented, see NOTES_metagpt.md

  # ---- v2 work order (TARGETS_rte_v2.md), 2026-09-03. Variants are labeled; plain midian unchanged.
  midian_r20:       {backend: llm, n: [1000], dist: [specialist, heavy_tail, bimodal], beta: [0.25, 0.5], declared_source: [programmatic, self_described],
                     methods: [midian, {name: midian, params: {r: 20}}, {name: midian_v, params: {r: 20}}]}                    # 1.4
  stratify:         {backend: llm, n: [1000], dist: [specialist, heavy_tail], beta: [0, 0.5], declared_source: [self_described],
                     methods: [midian, {name: midian, params: {stratify: true}}]}                                                 # 1.5
  live_n10k_v2:     {backend: llm, n: [10000], dist: [specialist], beta: [0, 0.25], declared_source: [self_described], b: [3], seeds: 1-3, Q: 300,
                     methods: [midian, midian_sh, midian_a, midian_v, {name: flat_probe_argmax, params: {online: true}}, {name: sequential_halving, params: {peer_reported: true}},
                               verify_on_claim, warm_start_bandit, linucb_honest, *frameworks, random]}                        # 2.2 (replaces the b=1/programmatic 10k row)
  midian_v_replication: {backend: llm, n: [100, 1000], dist: [specialist, heavy_tail, bimodal], beta: [0, 0.25, 0.5], declared_source: [programmatic, self_described],
                     seeds: 11-20, methods: [midian, midian_v, midian_va, {name: flat_probe_argmax, params: {online: true}}, {name: sequential_halving, params: {peer_reported: true}}]}   # 2.3: 10 FRESH seeds
  budget_b10_shapes: {backend: llm, n: [1000], dist: [bimodal, heavy_tail], beta: [0.25], b: [10], declared_source: [programmatic, self_described], seeds: 1-3, Q: 300,
                     methods: [midian, midian_v, {name: flat_probe_argmax, params: {online: true}}, sequential_halving, {name: sequential_halving, params: {peer_reported: true}}, fw_langgraph, fw_autogen, random]}   # 2.4
  internals_v2:     {backend: llm, n: [1000], dist: [specialist], beta: [0.5], collude: [true, false], liar_select: [random, low_skill_first], declared_source: [self_described],
                     methods: [{name: midian, params: {r: 5, delta: 0.0}}, {name: midian, params: {r: 5, delta: 0.3333333333333333}}, {name: midian, params: {r: 10, delta: 0.0}}, {name: midian, params: {r: 10, delta: 0.3333333333333333}},
                               {name: midian, params: {r: 20, delta: 0.0}}, {name: midian, params: {r: 20, delta: 0.3333333333333333}},
                               {name: midian_a, params: {r: 5, delta: 0.0}}, {name: midian_a, params: {r: 5, delta: 0.3333333333333333}}, {name: midian_a, params: {r: 10, delta: 0.0}}, {name: midian_a, params: {r: 10, delta: 0.3333333333333333}},
                               {name: midian_a, params: {r: 20, delta: 0.0}}, {name: midian_a, params: {r: 20, delta: 0.3333333333333333}}, flat_probe_argmax]}   # 2.5
  live_f1_core_s6_10: {<<: *live, seeds: 6-10, methods: [midian, {name: midian, params: {r: 5}}, midian_v, {name: midian_v, params: {r: 5}}, random, declared_argmax,
                       flat_probe_argmax, {name: flat_probe_argmax, params: {online: true}}, sequential_halving, {name: sequential_halving, params: {peer_reported: true}},
                       warm_start_bandit, verify_on_claim, llm_supervisor]}   # headline arms of live_f1_n1000 on 5 more seeds (variance); merge with --grids
  fw_live_n1000_lowskill: {mirror_of: fw_live_n1000, beta: [0.5], liar_select: [low_skill_first]}   # the regime where the report channel matters most; frameworks + paired arms
  fw_live_n100_lowskill:  {mirror_of: fw_live_n100,  beta: [0.5], liar_select: [low_skill_first]}
  churn_n1000:      {backend: llm, n: [1000], dist: [specialist, heavy_tail], beta: [0, 0.25], declared_source: [self_described], seeds: 1-5, Q: 1000,
                     blocks: [{churn: {frac: 0.1, every: 200}}, {churn: {frac: 0.3, every: 200}}],
                     methods: [midian, midian_sh, midian_a, midian_v, {name: sequential_halving, params: {peer_reported: true, churn_mode: rebuild}},
                               {name: sequential_halving, params: {peer_reported: true, churn_mode: stale}}, {name: flat_probe_argmax, params: {online: true}},
                               warm_start_bandit, linucb_honest, fw_langgraph, fw_autogen]}                                    # 2.1 (V2-6)
  variants_f1:      {<<: *live, declared_source: [self_described], seeds: 1-10, methods: [midian, midian_sh, midian_a, midian_sha, midian_v, midian_va, linucb_honest, {name: sequential_halving, params: {peer_reported: true}}, {name: flat_probe_argmax, params: {online: true}}]}   # Phase 1 variants on the F1 cells (V2-1..3, V2-5)

  # ---- bernoulli twins of every live grid: exercise the pipeline before the fleet is up (never headline numbers)
  bernoulli_mirror_live_core_n100:   {mirror_of: live_core_n100,   backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_live_f1_n1000:    {mirror_of: live_f1_n1000,    backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_live_extra_n1000: {mirror_of: live_extra_n1000, backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_live_n10k:        {mirror_of: live_n10k,        backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_budget_sweep:     {mirror_of: budget_sweep,     backend: bernoulli, seeds: 1-10, Q: 2000}
  bernoulli_mirror_midian_internals: {mirror_of: midian_internals, backend: bernoulli, seeds: 1-10, Q: 2000}
  # ---- replay twins of the live F1 sweep (RouterBench real outcomes, K=64 real categories): every algorithmic rival, CPU only
  replay_mirror_live_f1_n1000:    {mirror_of: live_f1_n1000,    backend: replay, K: [64], seeds: 1-10, Q: 2000, declared_source: [programmatic]}
  replay_mirror_live_extra_n1000: {mirror_of: live_extra_n1000, backend: replay, K: [64], seeds: 1-10, Q: 2000, declared_source: [programmatic]}  # replay has no self-description channel

  # ---- scale (F2/F3): replay 1e4-1e6 (real outcomes), bernoulli 1e2-1e7 calibrated to the measured S
  replay_scale:
    backend: replay
    K: [64]
    dist: [specialist, heavy_tail, bimodal]
    beta: [0.25]
    seeds: 1-3
    exclude: [trueskill_per_family]
    blocks: [{n: [10000, 100000]}, {n: [1000000], b: [1]}]
  # cheap multi-n twin of bernoulli_scale: exercises F2/F3/F3b and the cost-exponent fits on CPU
  # in minutes, so the message-accounting figures are verified before the fleet is up.
  bernoulli_cost_smoke:
    {n: [100, 1000, 10000], dist: [specialist], beta: [0.25], Q: 500, seeds: 1-3, methods: *cost_curve}

  bernoulli_scale:                         # K=16: it is calibrated to the MEASURED live S, which has 16 families
    K: [16]
    dist: [specialist]
    beta: [0.25]
    seeds: 1-3
    methods: *cost_curve
    backend_kwargs: {calibrate_from: $RTE_DATA/populations/specialist_n1000_K16_seed1/S.npy}
    blocks: [{n: [100, 1000, 10000, 100000]}, {n: [1000000], b: [1]}, {n: [10000000], b: [1], seeds: 1}]
