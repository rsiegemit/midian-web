  fw_live_n100_verified_va_lowskill: {mirror_of: fw_live_n100_lowskill, methods: *fw10_va}   # ... and its cartel cell

  # ---- 2026-09-17 coverage fill (COVERAGE.md §6): every arm that was cheap and simply never scheduled. Mirrors keep the
