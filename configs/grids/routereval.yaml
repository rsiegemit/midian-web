# RouterEval and LLMRouterBench recorded-score pools (no fleet needed)
grids:
  # [NUM | SUPERSEDED-BY:routereval_mmlu_norep_cal] RouterEval MMLU pools m = 10..10^3, every arm; read by: bar_figs +5
  # TARGETS_rte_v3 D2: every arm + liars on RouterEval's REAL LLM pools (dist axis = pool config)
  routereval_mmlu:
    backend: routereval
    backend_kwargs: {dataset: mmlu}
    n: [10, 100, 1000]
    K: [16]
    dist: [strong_to_weak, all_strong, all_weak]
    beta: [0, 0.25, 0.5]
    liar_select: [random, low_skill_first]
    declared_source: [programmatic]
    b: [3]
    seeds: "1-5"
    Q: 1000
    methods:
      - {name: midian, params: {audit: false, verify: false}}
      - {name: midian, params: {audit: false}}
      - {name: midian, params: {verify: false}}
      - midian
      - flat_probe_argmax
      - {name: flat_probe_argmax, params: {online: true}}
      - sequential_halving
      - {name: sequential_halving, params: {peer_reported: true}}
      - warm_start_bandit
      - linucb_honest
      - declared_argmax
      - knn_router
      - {name: knn_router, params: {online: true}}
      - mlp_router
      - random
      # 2026-09-17 coverage fill (COVERAGE.md §4): the declared-channel and bandit rivals the grid's "every arm"
      # promised
      - cnp_self_bid
      - cluster_head_router
      - declared_softmax
      - disrouter_cascade
      - route_to_k_majority
      - ucb_per_family
      - thompson_per_family
      - verify_on_claim
      - flat_nsw_router
      - referral_network
      - gossip_reputation_greedy
      - trueskill_per_family

  # [NUM | SUPERSEDED-BY:routereval5k_norep_cal] RouterEval 5,000-LLM leaderboard pool, every arm; read by: bar_figs +6
  # TARGETS_rte_v3 D2 at scale: ALL 5,000 leaderboard LLMs on MMLU (16 largest subjects), liars, no embeddings shipped
  routereval_mmlu5k:
    backend: routereval
    backend_kwargs: {dataset: leaderboard_mmlu}
    n: [5000]
    K: [16]
    dist: [all]
    beta: [0, 0.25, 0.5]
    liar_select: [random, low_skill_first]
    declared_source: [programmatic]
    b: [3]
    seeds: "1-3"
    Q: 300
    methods:
      - {name: midian, params: {audit: false, verify: false}}
      - {name: midian, params: {audit: false}}
      - {name: midian, params: {verify: false}}
      - midian
      - flat_probe_argmax
      - {name: flat_probe_argmax, params: {online: true}}
      - sequential_halving
      - {name: sequential_halving, params: {peer_reported: true}}
      - warm_start_bandit
      - linucb_honest
      - declared_argmax
      - knn_router
      - random
      # 2026-09-17 coverage fill (COVERAGE.md §4): the declared-channel and bandit rivals the grid's "every arm"
      # promised
      - cnp_self_bid
      - cluster_head_router
      - declared_softmax
      - disrouter_cascade
      - route_to_k_majority
      - ucb_per_family
      - thompson_per_family
      - verify_on_claim
      - flat_nsw_router
      - referral_network
      - gossip_reputation_greedy
      - trueskill_per_family
      - {name: knn_router, params: {online: true}}   # 2026-09-17: was never listed here (COVERAGE.md §4)

  # [NUM] v4 cohort modes on RouterEval m = 10^3; read by: cohort_table, paper_numbers
  cohort_routereval:                # TARGETS_rte_v4: cohort modes on RouterEval's REAL m = 1,000 LLM pools.
                                    # No fleet needed - this backend's probes and executions are recorded-score lookups.
    backend: routereval
    backend_kwargs: {dataset: mmlu}
    n: [1000]
    K: [16]
    dist: [strong_to_weak, all_strong, all_weak]
    beta: [0, 0.5]
    liar_select: [random, low_skill_first]
    declared_source: [programmatic]
    b: [3, 10]
    seeds: "1-5"
    Q: 1000
    methods: [{set: cohort_arms}, random]     # the oracle line is emitted by the runner, not a method module

  # [NUM] v4 cohort modes on the 5,000-LLM pool; read by: cohort_table, paper_numbers
  cohort_routereval5k:              # TARGETS_rte_v4 on ALL 5,000 leaderboard LLMs. Recorded-score backend: no fleet.
    mirror_of: routereval_mmlu5k
    beta: [0, 0.5]
    b: [3, 10]
    methods: [{set: cohort_arms}, random]

  # [NUM] v4 cohort modes on LLMRouterBench (expected null); read by: cohort_table, paper_numbers
  # TARGETS_rte_v4 on LLMRouterBench's 20-model pool. NOTE n = 20 with r = 10 gives two
  cohort_llmrouterbench:
                                    # cohorts and a depth-1 tree, so cohort STRUCTURE has almost nothing to act on here;
                                    # included for completeness and expected to be null.
    mirror_of: llmrouterbench_pool
    beta: [0, 0.5]
    b: [3, 10]
    methods: [{set: cohort_arms}, random]

  # [NUM | SUPERSEDED-BY:fw_routereval_1k_norep_cal] frameworks on RouterEval m = 10^3 (post hoc); read by: bar_figs +1
  # POST-HOC (2026-09-05): same post-hoc arm as fw_routereval_5k, on RouterEval's m = 1,000
  fw_routereval_1k:
                                    # real-LLM pools. Those pools DO ship real model names, but the adapter reads the
                                    # same
                                    # declaration-rendered descriptions as the 5k grid so the two pool sizes stay
                                    # comparable
                                    # (see DEVIATIONS). Magentic-One excluded here too, so the 1k and 5k framework
                                    # ranges cover
                                    # the same nine frameworks. Cells match routereval_mmlu, so rows pair with the arms
                                    # there.
    mirror_of: routereval_mmlu
    allow_llm_methods: true
    n: [1000]
    beta: [0, 0.5]
    methods: [fw_langgraph, fw_crewai, fw_autogen, fw_maf, fw_openai_agents, fw_google_adk,
              fw_llamaindex, fw_smolagents, fw_camel_workforce]

  # [NUM | SUPERSEDED-BY:fw_routereval_5k_norep_cal] frameworks on RouterEval 5k (post hoc); read by: bar_figs +1
  # POST-HOC (2026-09-05, not pre-registered): the deployed frameworks on RouterEval's 5,000-LLM
  fw_routereval_5k:
                                    # leaderboard pool. That pool's model names are synthetic (llm0..llm4999), so the
                                    # adapter's
                                    # fallback descriptions apply: each agent's declaration vector rendered as text. The
                                    # frameworks
                                    # therefore read the same declaration channel as declared_argmax (honest+noisy at
                                    # beta=0,
                                    # corrupted by liars above it); the TF-IDF retrieval step is degenerate on rendered
                                    # numbers, so
                                    # only the supervisor's pick among the top-10 carries signal. Magentic-One is
                                    # excluded: at 18 s
                                    # per task it alone would take 5 h per unit. Agents are table lookups, so the only
                                    # LLM calls are
                                    # the supervisor's.
    mirror_of: routereval_mmlu5k
    allow_llm_methods: true         # frameworks need only a supervisor endpoint; the world backend stays routereval
    beta: [0, 0.5]
    methods: [fw_langgraph, fw_crewai, fw_autogen, fw_maf, fw_openai_agents, fw_google_adk,
              fw_llamaindex, fw_smolagents, fw_camel_workforce]

  # [NUM | SUPERSEDED-BY:llmrouterbench_norep_cal] LLMRouterBench 20 models x 15 datasets; read by: bar_figs +4
  # TARGETS_rte_v3 F: every arm + liars on LLMRouterBench's 20 real models × 15 datasets (family = dataset)
  llmrouterbench_pool:
    backend: routereval
    backend_kwargs: {dataset: llmrouterbench}
    n: [20]
    K: [15]
    dist: [all]
    beta: [0, 0.25, 0.5]
    liar_select: [random, low_skill_first]
    declared_source: [programmatic]
    b: [3]
    seeds: "1-5"
    Q: 1000
    methods:
      - {name: midian, params: {audit: false, verify: false}}
      - {name: midian, params: {audit: false}}
      - {name: midian, params: {verify: false}}
      - midian
      - flat_probe_argmax
      - {name: flat_probe_argmax, params: {online: true}}
      - sequential_halving
      - {name: sequential_halving, params: {peer_reported: true}}
      - warm_start_bandit
      - linucb_honest
      - declared_argmax
      - knn_router
      - {name: knn_router, params: {online: true}}
      - mlp_router
      - random
      # 2026-09-17 coverage fill (COVERAGE.md §4): the declared-channel and bandit rivals the grid's "every arm"
      # promised
      - cnp_self_bid
      - cluster_head_router
      - declared_softmax
      - disrouter_cascade
      - route_to_k_majority
      - ucb_per_family
      - thompson_per_family
      - verify_on_claim
      - flat_nsw_router
      - referral_network
      - gossip_reputation_greedy
      - trueskill_per_family

  # ---- 2026-09-17 coverage fill (COVERAGE.md §6): every arm that was cheap and simply never scheduled. Mirrors keep
  # the
  # source cells, seeds and Q; only the arm lists differ. Live units execute their routed tasks live, so they wait on
  # fleet health like every live grid.
  # [NUM | SUPERSEDED-BY:fw_routereval_small_norep_cal] frameworks on RouterEval m = 10 / 100; read by: shortlist_figs
  # the nine frameworks on RouterEval's m = 10 and 100 pools
  fw_routereval_small: {mirror_of: fw_routereval_1k, n: [10, 100]}

  # [NUM | SUPERSEDED-BY:fw_routereval_1k_em_norep_cal] MiniLM shortlist of fw_routereval_1k; read by: shortlist_figs
  fw_routereval_1k_em:
    mirror_of: fw_routereval_1k
    methods: [{set: fw9_em}]

  # [NUM | SUPERSEDED-BY:fw_routereval_5k_em_norep_cal] MiniLM shortlist of fw_routereval_5k; read by: shortlist_figs
  fw_routereval_5k_em:      {mirror_of: fw_routereval_5k,    methods: {set: fw9_em}}

  # [NUM | SUPERSEDED-BY:fw_routereval_small_em_norep_cal] MiniLM shortlist; read by: shortlist_figs
  fw_routereval_small_em:   {mirror_of: fw_routereval_small, methods: {set: fw9_em}}

  # [NUM | SUPERSEDED-BY:fw_routereval_1k_va_norep_cal] MIDIAN-cohort shortlist; read by: shortlist_figs
  fw_routereval_1k_va:
    mirror_of: fw_routereval_1k
    methods: [{set: fw9_va}]

  # [NUM | SUPERSEDED-BY:fw_routereval_5k_va_norep_cal] MIDIAN-cohort shortlist; read by: shortlist_figs
  fw_routereval_5k_va:      {mirror_of: fw_routereval_5k,    methods: {set: fw9_va}}

  # [NUM | SUPERSEDED-BY:fw_routereval_small_va_norep_cal] MIDIAN-cohort shortlist; read by: shortlist_figs
  fw_routereval_small_va:   {mirror_of: fw_routereval_small, methods: {set: fw9_va}}

  # [NUM | SUPERSEDED-BY:routereval5k_norep_cal] MIDIAN at b = 1 / 5 on routereval_mmlu5k; read by: seed_tables
  va_b_routereval5k:
    mirror_of: routereval_mmlu5k
    beta: [0, 0.5]
    liar_select: [low_skill_first]
    b: [1, 5]
    methods: [midian]

  # [NUM | SUPERSEDED-BY:llmrouterbench_norep_cal] MIDIAN at b = 1 / 5 on llmrouterbench_pool; read by: seed_tables
  va_b_llmrouterbench:
    mirror_of: llmrouterbench_pool
    beta: [0, 0.5]
    liar_select: [low_skill_first]
    b: [1, 5]
    methods: [midian]

  # [NUM | SUPERSEDED-BY:routereval5k_norep_cal] rivals at b = 1 / 5 on va_b_routereval5k; read by: seed_tables
  rivals_b_routereval5k:
    mirror_of: va_b_routereval5k
    methods:
      - {name: midian, params: {audit: false, verify: false}}
      - {name: flat_probe_argmax, params: {online: true}}
      - {name: warm_start_bandit, params: {}}
      - {name: linucb_honest, params: {}}
      - {name: knn_router, params: {}}
      - {name: cluster_head_router, params: {}}
      - {name: disrouter_cascade, params: {}}
      - {name: ucb_per_family, params: {}}
      - {name: thompson_per_family, params: {}}
      - {name: flat_nsw_router, params: {}}
      - {name: trueskill_per_family, params: {}}
      - {name: knn_router, params: {online: true}}

  # [NUM | SUPERSEDED-BY:llmrouterbench_norep_cal] rivals at b = 1 / 5 on va_b_llmrouterbench; read by: seed_tables
  rivals_b_llmrouterbench:
    mirror_of: va_b_llmrouterbench
    methods:
      - {name: midian, params: {audit: false, verify: false}}
      - {name: flat_probe_argmax, params: {online: true}}
      - {name: warm_start_bandit, params: {}}
      - {name: linucb_honest, params: {}}
      - {name: knn_router, params: {}}
      - {name: knn_router, params: {online: true}}
      - {name: mlp_router, params: {}}
      - {name: cluster_head_router, params: {}}
      - {name: disrouter_cascade, params: {}}
      - {name: ucb_per_family, params: {}}
      - {name: thompson_per_family, params: {}}
      - {name: flat_nsw_router, params: {}}
      - {name: trueskill_per_family, params: {}}

