  # reranker
  # (stock, both instructions). Nine frameworks as the other fw_routereval grids; the mixed strong-to-weak pool at
  # 10-1,000 and
  # the leaderboard at 5,000; honest + beta = 0.5 low-skill cartel. Embedding / rerank caches are content-keyed under
