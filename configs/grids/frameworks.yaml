        - {name: fw_crewai, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}
        - {name: fw_autogen, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}
        - {name: fw_magentic_one, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}
        - {name: fw_maf, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}
        - {name: fw_openai_agents, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}
        - {name: fw_google_adk, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}
        - {name: fw_llamaindex, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}
        - {name: fw_smolagents, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}
        - {name: fw_camel_workforce, params: {retrieval: bm25, dedup: true, lie_text: true, claim_threshold: 0.7}}

  # ---- 2026-09-16: the missing cartel cell for the frameworks on the MIDIAN cohort (the verified-cohort grids ran
