# 2026-10-07 review runs. (1) The matched-budget best-arm-identification baseline: sequential halving (trusted
# observer, peer-reported, and peer-reported + MIDIAN's audits) on every Figure A / B cell, 10 seeds at live n.
# (2) Adaptive attacks (world.parse_lie): a cartel that tells each lie with probability q, a cartel lying about one
# family only, and declared inflation below the standard 0.4. None of these grids feeds a figure yet: halving stays out
# of every figure (lib/exclusions.py) until the user decides; the attack grids get their own table.
grids:
  # ---- (1) halving on Figure A's live cells (specialist, self-described; b as A draws), 10 seeds
  # [NUM] three halving arms at live n = 100, b = 1 / 3 / 5; read by: none yet
  halving_live_n100:
    mirror_of: learned_n100
    dist: [specialist]
    beta: [0, 0.5]
    liar_select: [low_skill_first]
    b: [1, 3, 5]
    seeds: 1-10
    methods: {set: halving_arms}

  # [NUM] three halving arms at live n = 1,000, b = 1 / 3 / 5; read by: none yet
  halving_live_n1000:
    mirror_of: halving_live_n100
    n: [1000]

  # [NUM] three halving arms at live n = 10^4 (every learned_n10k cell at b = 3); read by: none yet
  halving_live_n10k:
    mirror_of: learned_n10k
    seeds: 1-10
    methods: {set: halving_arms}
    blocks: [{b: [3]}, {b: [1, 5], beta: [0, 0.5], liar_select: [low_skill_first]}]

  # [PENDING | NUM] three halving arms at live n = 10^5 (every live_n100k cell at b = 3); read by: none yet
  halving_live_n100k:
    mirror_of: live_n100k
    seeds: 1-10
    methods: {set: halving_arms}
    blocks: [{b: [3]}, {b: [1, 5], beta: [0, 0.5], liar_select: [low_skill_first]}]

  # ---- (1) halving on Figure B's non-live cells (the erratum-30 grids B reads), their seeds
  # [NUM] three halving arms on bernoulli_1e7_cal's cells; read by: none yet
  halving_bernoulli_1e7:
    mirror_of: bernoulli_1e7_cal
    methods: {set: halving_arms}
    blocks: [{n: [10000000], b: [1, 3, 5], seeds: 1-100, beta: [0, 0.5], liar_select: [low_skill_first]}]

  # [NUM] three halving arms on replay_1e6_split_cal's cells; read by: none yet
  halving_replay_1e6:
    mirror_of: replay_1e6_split_cal
    methods: {set: halving_arms}
    blocks: [{n: [1000000], b: [1, 3, 5], seeds: 1-30, beta: [0, 0.5], liar_select: [low_skill_first]}]

  # [NUM] three halving arms on routereval5k_norep_cal's cells, 10 seeds as B; read by: none yet
  halving_routereval5k:
    mirror_of: routereval5k_norep_cal
    methods: {set: halving_arms}
    seeds: 1-10
    blocks: [{b: [1, 3, 5]}]

  # [NUM] three halving arms on llmrouterbench_norep_cal's cells, 10 seeds as B; read by: none yet
  halving_llmrouterbench:
    mirror_of: llmrouterbench_norep_cal
    methods: {set: halving_arms}
    seeds: 1-10
    blocks: [{b: [1, 3, 5]}]

  # ---- (2) adaptive attacks: every arm that reads reports or claims, plus the probe-only control
  # [NUM] partial / single-family / sub-tolerance lies on Bernoulli, calibrated claims; read by: none yet
  attack_bernoulli:
    mirror_of: bernoulli_scale_v5
    declared_source: [calibrated]
    n: [10000, 100000, 1000000]
    b: [3]
    beta: [0.25, 0.5]
    liar_select: [low_skill_first, random]
    lie_mode: [inflate:q=0.02, inflate:q=0.05, inflate:q=0.1, inflate:q=0.25, inflate:q=0.5, inflate:fam=0,
               inflate:d=0.05, inflate:d=0.1, inflate:d=0.2]
    seeds: 1-20
    blocks: []
    methods: {set: attack_arms}

  # [NUM] the attacks at live n = 10^4 (learned_n10k's cartel cells); read by: none yet
  attack_live_n10k:
    mirror_of: learned_n10k
    beta: [0.5]
    liar_select: [low_skill_first, random]
    lie_mode: [inflate:q=0.02, inflate:q=0.05, inflate:q=0.1, inflate:q=0.25, inflate:q=0.5, inflate:fam=0,
               inflate:d=0.05, inflate:d=0.1, inflate:d=0.2]
    seeds: 1-10
    methods: {set: attack_arms}

  # [PENDING | NUM] four attacks at live n = 10^5 (the low-skill cartel cell); read by: none yet
  attack_live_n100k:
    mirror_of: live_n100k
    beta: [0.5]
    liar_select: [low_skill_first]
    lie_mode: [inflate:q=0.05, inflate:q=0.25, inflate:fam=0, inflate:d=0.1]
    seeds: 1-10
    methods: {set: attack_arms}
