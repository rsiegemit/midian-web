# configs/grids/ -- named grids for `python -m midian.run --grid <name>`, read by midian.run.load_config() in sorted file
# order: this file holds `defaults` and `_sets`; every other file holds only `grids:` (a name defined twice raises; so
# does a duplicate key anywhere). Axes: backend n K dist beta liar_select collude declared_source lie_mode demand b Q
# (lists = cartesian product). methods: an explicit list of `name` | {name, params} | {set: NAME} (a set of methods
# flattens into the list). `mirror_of: <grid>` copies that grid (any file), then overrides; `use: NAME` merges the
# mapping _sets[NAME] under the grid's own keys. `blocks:` = several axis blocks in one grid. The runner always adds
# an `oracle` row per (cell, seed). YAML anchors/aliases are not used: they cannot cross files.
# Every grid carries one header line: [tags] purpose; read by: scripts. Tags: FIG:<letters> = drawn in condensed
# figure(s) A-I (docs/figure_provenance.md); NUM = feeds numbers/tables but no figure; HIST = historical, read by no
# current script; SUPERSEDED-BY:<grid> = a later grid replaces it in the figures; PENDING = defined, rows outstanding;
# SMOKE = quick check. Grids are never deleted: a name is its results directory and part of every row id.
defaults:
  backend: bernoulli
  K: [16]
  liar_select: [random]
  collude: [true]
  declared_source: [programmatic]
  lie_mode: [inflate]
  demand: [uniform]
  b: [3]
  Q: 1000
  seeds: 1-5
  exclude: []
_sets:
  live: {backend: llm, n: [1000], dist: [specialist, heavy_tail, bimodal], beta: [0, 0.1, 0.25, 0.5],
         liar_select: [random, low_skill_first], declared_source: [programmatic, self_described]}   # grid: `use: live`
