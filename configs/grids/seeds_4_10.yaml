# Seeds 4-10 for Figure 1's non-framework arms at live n = 10^4 and 10^5, so every live n has 10 seeds as n <= 10^3
# does. Each grid <source>_s4_10 mirrors the grid a Figure 1 bar (or pool candidate) at that n comes from and keeps
# only the cells and arms Figure 1 draws: specialist, self-described, honest (beta = 0) and the beta = 0.5 low-skill
# cartel, b as in the source. Every (cell, method) is one of the source's; only the seeds differ. Honest b = 3 cells
# use liar_select random (the cell bar_figs reads; beta = 0 rows are identical under either selection). Left out: the
# frameworks (not in scope), plain linucb_honest (replaced by bonus = own) and pool_fill's TrueSkill (Figure 1 reads
# TrueSkill only from trueskill_fix_*). scripts/figures/lib/grids.S4_10 adds these grids to the figures only once
# every one of them is complete.
grids:
  # ---- live n = 10^4, b = 3 (grids.LIVE_GRIDS[10000])
  # [FIG:A] seeds 4-10 of learned_n10k's drawn arms; read by: bar_figs, seed_tables
  learned_n10k_s4_10:
    mirror_of: learned_n10k
    seeds: 4-10
    methods:
      - midian
      - {name: midian, params: {audit: false, verify: false}}
      - {name: flat_probe_argmax, params: {online: true}}
      - warm_start_bandit
      - declared_argmax
      - knn_router
      - {name: knn_router, params: {online: true}}
    blocks: [{beta: [0], liar_select: [random]}, {beta: [0.5], liar_select: [low_skill_first]}]

  # [FIG:A] seeds 4-10 of random, honest, at n = 10^4 (live_n10k_v2); read by: bar_figs, seed_tables
  live_n10k_v2_s4_10: {mirror_of: live_n10k_v2, seeds: 4-10, beta: [0], methods: [random]}

  # [FIG:A] seeds 4-10 of random under the cartel at n = 10^4; read by: bar_figs, seed_tables
  live_n10k_cartel_random_s4_10: {mirror_of: live_n10k_cartel_random, seeds: 4-10}

  # ---- live n = 10^4, b = 1 / 5 and the pool candidates (grids.b_grids("n10k"), tuned_wsb_n10k)
  # [FIG:A] seeds 4-10 of MIDIAN at b = 1 / 5 (va_b_n10k); read by: condensed_figs, seed_tables
  va_b_n10k_s4_10: {mirror_of: va_b_n10k, seeds: 4-10}

  # [FIG:A] seeds 4-10 of the b = 1 / 5 rivals (rivals_b_n10k); read by: condensed_figs, seed_tables
  rivals_b_n10k_s4_10:
    mirror_of: rivals_b_n10k
    seeds: 4-10
    methods:
      - {name: midian, params: {audit: false, verify: false}}
      - {name: flat_probe_argmax, params: {online: true}}
      - {name: warm_start_bandit, params: {}}
      - {name: knn_router, params: {}}
      - {name: knn_router, params: {online: true}}
      - {name: warm_start_bandit, params: {n0: 0.5}}

  # [FIG:A] seeds 4-10 of the pool fill at b = 1 / 3 / 5 (pool_fill_n10k); read by: seed_tables
  pool_fill_n10k_s4_10:
    mirror_of: pool_fill_n10k
    seeds: 4-10
    methods: [flat_nsw_router, cluster_head_router, disrouter_cascade, ucb_per_family, thompson_per_family]
    blocks: [{}]

  # [FIG:A] seeds 4-10 of warm_start_bandit[n0=0.5] at b = 3 (tuned_wsb_n10k); read by: seed_tables
  tuned_wsb_n10k_s4_10: {mirror_of: tuned_wsb_n10k, seeds: 4-10}

  # [FIG:A] seeds 4-10 of LinUCB bonus=own at b = 1 / 3 / 5 (linucb_fix_n10k); read by: seed_tables
  linucb_fix_n10k_s4_10: {mirror_of: linucb_fix_n10k, seeds: 4-10}

  # [FIG:A] seeds 4-10 of TrueSkill at b = 1 / 3 / 5 (trueskill_fix_n10k); read by: seed_tables
  trueskill_fix_n10k_s4_10: {mirror_of: trueskill_fix_n10k, seeds: 4-10}

  # ---- live n = 10^5, b = 3 (grids.LIVE_GRIDS[100000])
  # [FIG:A,B] seeds 4-10 of live_n100k's drawn arms; read by: bar_figs, seed_tables
  live_n100k_s4_10:
    mirror_of: live_n100k
    seeds: 4-10
    methods:
      - midian
      - {name: midian, params: {audit: false, verify: false}}
      - {name: flat_probe_argmax, params: {online: true}}
      - declared_argmax
      - random
      - warm_start_bandit
      - knn_router
      - {name: knn_router, params: {online: true}}
    blocks: [{beta: [0], liar_select: [random]}, {beta: [0.5], liar_select: [low_skill_first]}]

  # ---- live n = 10^5, b = 1 / 5 and the pool candidates (grids.b_grids("n100k"), tuned_wsb_n100k; no TrueSkill)
  # [FIG:A,B] seeds 4-10 of MIDIAN at b = 1 / 5 (va_b_n100k); read by: condensed_figs, seed_tables
  va_b_n100k_s4_10: {mirror_of: va_b_n100k, seeds: 4-10}

  # [FIG:A,B] seeds 4-10 of the b = 1 / 5 rivals (rivals_b_n100k); read by: condensed_figs, seed_tables
  rivals_b_n100k_s4_10:
    mirror_of: rivals_b_n100k
    seeds: 4-10
    methods:
      - {name: knn_router, params: {}}
      - {name: knn_router, params: {online: true}}
      - {name: midian, params: {audit: false, verify: false}}
      - {name: flat_probe_argmax, params: {online: true}}
      - {name: warm_start_bandit, params: {}}
      - {name: warm_start_bandit, params: {n0: 0.5}}

  # [FIG:A,B] seeds 4-10 of the pool fill at b = 1 / 3 / 5 (pool_fill_n100k); read by: seed_tables
  pool_fill_n100k_s4_10: {mirror_of: pool_fill_n100k, seeds: 4-10}

  # [FIG:A,B] seeds 4-10 of warm_start_bandit[n0=0.5] at b = 3 (tuned_wsb_n100k); read by: seed_tables
  tuned_wsb_n100k_s4_10: {mirror_of: tuned_wsb_n100k, seeds: 4-10}

  # [FIG:A,B] seeds 4-10 of LinUCB bonus=own at b = 1 / 3 / 5 (linucb_fix_n100k); read by: seed_tables
  linucb_fix_n100k_s4_10: {mirror_of: linucb_fix_n100k, seeds: 4-10}

  # ---- the max-lie cartel cells of Figures 1 / 2 at live n = 10^4 / 10^5 (configs/grids/max_lie.yaml), seeds 4-10,
  # so A_max_lie_new / B_max_lie_new compare 10-seed standard and max lie; n = 10^2 / 10^3 already have seeds 1-10
  # [FIG:A] seeds 4-10 of lie_max_arms_n10k; read by: lie_max_ab
  lie_max_arms_n10k_s4_10: {mirror_of: lie_max_arms_n10k, seeds: 4-10}

  # [FIG:A,B] seeds 4-10 of lie_max_arms_n100k; read by: lie_max_ab
  lie_max_arms_n100k_s4_10: {mirror_of: lie_max_arms_n100k, seeds: 4-10}
